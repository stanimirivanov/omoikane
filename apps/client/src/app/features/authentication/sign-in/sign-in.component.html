<section class="auth-form" aria-labelledby="sign-in-heading">
  @let isSigningIn = store.isSigningIn();
  @let signInError = store.error();

  <div class="auth-form__heading">
    <h1 id="sign-in-heading">Sign in to Omoikane</h1>
    <p>Continue to your workspaces, conversations, and analysis.</p>
  </div>

  <form
    (submit)="
      $event.preventDefault(); submit(emailInput.value, passwordInput.value)
    "
  >
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Email</mat-label>
      <svg matPrefix lucideMail [size]="18" aria-hidden="true"></svg>
      <input
        matInput
        #emailInput
        id="sign-in-email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [attr.aria-describedby]="signInError ? 'sign-in-error' : null"
        [disabled]="isSigningIn"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Password</mat-label>
      <svg matPrefix lucideLockKeyhole [size]="18" aria-hidden="true"></svg>
      <input
        matInput
        #passwordInput
        id="sign-in-password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [attr.aria-describedby]="signInError ? 'sign-in-error' : null"
        [disabled]="isSigningIn"
      />
    </mat-form-field>

    <button
      mat-flat-button
      class="auth-primary-action"
      type="submit"
      [disabled]="isSigningIn"
    >
      @if (isSigningIn) {
        <mat-spinner diameter="18" />
        Signing in…
      } @else {
        Sign in
        <svg lucideArrowRight [size]="17" aria-hidden="true"></svg>
      }
    </button>
  </form>

  @if (signInError; as error) {
    <div
      id="sign-in-error"
      class="auth-feedback auth-feedback--error"
      role="alert"
    >
      <p>{{ error.message }}</p>
      <button mat-button type="button" (click)="store.clearError()">
        Dismiss
      </button>
    </div>
  }
</section>
