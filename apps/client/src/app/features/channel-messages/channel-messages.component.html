@let typingView = typingStore.view();

<section class="conversation" aria-label="Channel conversation">
  <div class="conversation-timeline">
    <app-channel-message-history
      [canModerateMessages]="canModerateMessages()"
    />
  </div>

  <div class="typing-status" aria-live="polite" aria-atomic="true">
    @switch (typingView.kind) {
      @case ('connecting') {
        <p>Connecting typing indicators&hellip;</p>
      }
      @case ('error') {
        <p role="alert">{{ typingView.error.message }}</p>
        <button mat-button type="button" (click)="typingStore.retry()">
          <svg lucideRefreshCw [size]="14" aria-hidden="true"></svg>
          Retry typing
        </button>
      }
      @case ('typing') {
        <p>
          <span class="typing-dots" aria-hidden="true">
            <span></span><span></span><span></span>
          </span>
          {{ typingView.count }}
          {{ typingView.count === 1 ? 'member is' : 'members are' }}
          typing&hellip;
        </p>
      }
    }
  </div>

  <app-channel-message-composer
    (typingActivity)="typingStore.recordActivity()"
    (typingStopped)="typingStore.stopActivity()"
  />
</section>
