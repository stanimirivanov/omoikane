<section>
  @let typingView = typingStore.view();

  <app-channel-message-history [canModerateMessages]="canModerateMessages()" />

  @switch (typingView.kind) {
    @case ('connecting') {
      <p>Connecting typing indicators&hellip;</p>
    }
    @case ('error') {
      <p role="alert">{{ typingView.error.message }}</p>
      <button type="button" (click)="typingStore.retry()">Retry typing</button>
    }
    @case ('typing') {
      <p aria-live="polite">
        {{ typingView.count }}
        {{ typingView.count === 1 ? 'member is' : 'members are' }}
        typing&hellip;
      </p>
    }
  }

  <app-channel-message-composer
    (typingActivity)="typingStore.recordActivity()"
    (typingStopped)="typingStore.stopActivity()"
  />
</section>
