@let view = store.composerView();

<div class="composer-region">
  <form
    class="message-composer"
    (submit)="$event.preventDefault(); sendMessage(draft())"
  >
    <label class="visually-hidden" for="message-content">Message</label>

    <input
      #messageInput
      id="message-content"
      name="message-content"
      type="text"
      maxlength="4000"
      autocomplete="off"
      placeholder="Write a message"
      [attr.aria-describedby]="view.error ? 'message-composer-error' : null"
      [value]="draft()"
      [disabled]="view.isSending"
      (input)="updateDraft(messageInput.value)"
      (blur)="typingStopped.emit()"
    />

    <button mat-flat-button type="submit" [disabled]="view.isSending">
      <svg lucideSendHorizontal [size]="17" aria-hidden="true"></svg>
      <span class="send-label">
        @if (view.isSending) {
          Sending&hellip;
        } @else {
          Send
        }
      </span>
    </button>
  </form>

  @if (view.error; as error) {
    <div id="message-composer-error" class="composer-error" role="alert">
      <span>{{ error.message }}</span>
      <button mat-button type="button" (click)="store.clearSendError()">
        Dismiss
      </button>
    </div>
  }
</div>
