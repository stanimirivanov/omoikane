@let view = store.composerView();

<form (submit)="$event.preventDefault(); sendMessage(draft())">
  <label for="message-content">Message</label>

  <input
    #messageInput
    id="message-content"
    name="message-content"
    type="text"
    maxlength="4000"
    [value]="draft()"
    [disabled]="view.isSending"
    (input)="updateDraft(messageInput.value)"
    (blur)="typingStopped.emit()"
  />

  <button type="submit" [disabled]="view.isSending">
    @if (view.isSending) {
      Sending…
    } @else {
      Send
    }
  </button>
</form>

@if (view.error; as error) {
  <p role="alert">{{ error.message }}</p>
  <button type="button" (click)="store.clearSendError()">Dismiss</button>
}
