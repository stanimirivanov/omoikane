@let view = store.view();

<section
  class="presence"
  [class.presence--online]="view.kind === 'online'"
  [class.presence--error]="view.kind === 'error'"
  aria-labelledby="workspace-presence-heading"
>
  <h3 id="workspace-presence-heading" class="visually-hidden">Presence</h3>
  <span class="presence-dot" aria-hidden="true"></span>

  @switch (view.kind) {
    @case ('connecting') {
      <p role="status">Connecting&hellip;</p>
    }
    @case ('error') {
      <p role="alert">{{ view.error.message }}</p>
      <button mat-button type="button" (click)="store.retry()">
        <svg lucideRefreshCw [size]="13" aria-hidden="true"></svg>
        Retry
      </button>
    }
    @case ('online') {
      <p aria-live="polite">
        {{ view.count }} {{ view.count === 1 ? 'member' : 'members' }} online
      </p>
    }
  }
</section>
