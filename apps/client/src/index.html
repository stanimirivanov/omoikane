<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Omoikane | Collaborative Intelligence Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Omoikane is Izanagi's Collaborative Intelligence Platform."
    />
    <meta name="application-name" content="Omoikane" />
    <meta name="theme-color" content="#211625" />
    <meta
      property="og:title"
      content="Omoikane | Collaborative Intelligence Platform"
    />
    <meta property="og:site_name" content="Omoikane" />
    <meta
      property="og:description"
      content="Collaboration, organizational knowledge, and auditable intelligence workflows."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <!--
      This content is deliberately framework-free. It is the only UI available
      while the browser downloads and starts Angular, and Angular replaces it
      when AppComponent is bootstrapped.
    -->
    <app-root>
      <main
        class="application-startup"
        aria-label="Starting Omoikane"
        aria-busy="true"
      >
        <div class="application-startup__content">
          <span class="application-startup__mark" aria-hidden="true">O</span>
          <div>
            <p class="application-startup__product">Omoikane</p>
            <p class="application-startup__status" role="status">
              Starting application…
            </p>
          </div>
          <span class="application-startup__progress" aria-hidden="true"></span>
        </div>
      </main>
    </app-root>
  </body>
</html>
