name: omoikane-ai

services:
  ollama:
    image: ollama/ollama:0.33.3
    ports:
      - 11434:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-data:
